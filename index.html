<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071d4c" />
    <meta name="description" content="A native browser remake of Pepsiman, built from the original PlayStation models, textures, animations, and soundtrack." />
    <title>PEPSIMAN — Native Web Remake</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="game" aria-label="Pepsiman game canvas"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="retail-ending-flash" id="retail-ending-flash" aria-hidden="true"></div>

    <section class="cinematic" id="cinematic" aria-label="Original PlayStation cutscene" hidden>
      <video id="cutscene" playsinline preload="metadata" disablepictureinpicture></video>
      <button id="skip-cutscene">SKIP · ENTER</button>
    </section>

    <header class="hud" hidden aria-label="Retail game HUD">
      <div class="retail-can-counter" aria-label="Pepsi cans collected"><i class="retail-can"></i><span class="large-hud-digits" id="cans"></span></div>
      <div class="retail-countdown" aria-label="Time remaining"><i class="retail-pepsi-ball"></i><span class="large-hud-digits" id="time-left"></span></div>
      <div class="retail-progress" aria-label="Stage progress">
        <i class="retail-progress-track"><b id="progress-fill"></b></i>
        <span class="small-hud-digits" id="total-time"></span><i class="retail-total-label"></i>
      </div>
      <div class="retail-lives" aria-label="Lives"><span class="large-hud-digits" id="life-count"></span><i class="retail-runner-icon"></i></div>
      <span id="distance" hidden>0000</span>
      <button class="sound" id="sound" aria-label="Toggle sound">♪</button>
    </header>

    <section class="pause-screen" id="pause-screen" hidden aria-label="Game paused"><i aria-label="Pause"></i><small>PRESS ESC / P TO CONTINUE</small></section>

    <section class="start-screen" id="start-screen">
      <div class="title-lockup">
        <h1>PEPSI<span>MAN</span></h1>
        <div class="title-globe" aria-hidden="true"><i></i></div>
      </div>
      <button class="start-button" id="start-button">
        <span>PRESS START BUTTON</span>
        <small>ENTER</small>
      </button>
      <button class="continue-button" id="continue-button" hidden>CONTINUE · SCENE <span>1</span></button>
      <button class="opening-button" id="opening-button">WATCH ORIGINAL OPENING</button>
      <p class="title-legal">© 1999 KID · ORIGINAL PLAYSTATION ASSETS</p>
      <p class="loading" id="loading">DECODING ORIGINAL TMD MODEL…</p>
      <a class="rig-lab-link" href="skeleton.html">OPEN 16-JOINT RIG LAB</a>
    </section>

    <section class="game-over" id="game-over" hidden>
      <div class="retail-results-bg" aria-hidden="true">
        <img src="assets/ripped/ui/global-012.png" alt="" /><img src="assets/ripped/ui/global-013.png" alt="" />
        <img src="assets/ripped/ui/global-014.png" alt="" /><img src="assets/ripped/ui/global-015.png" alt="" />
        <img src="assets/ripped/ui/global-016.png" alt="" /><img src="assets/ripped/ui/global-017.png" alt="" />
        <img src="assets/ripped/ui/global-018.png" alt="" /><img src="assets/ripped/ui/global-019.png" alt="" />
      </div>
      <div class="retail-results-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="retail-clear-title" role="img" aria-label="Scene 1 clear">
        <span class="retail-heading-line"><i class="retail-scene-one" id="result-heading"></i><i class="retail-stage-number" id="result-stage-number"></i></span><i class="retail-clear-word"></i>
      </div>
      <div class="retail-scorecards">
        <div class="retail-pepsi-score"><i class="retail-result-label retail-get-pepsi" aria-label="Get Pepsi"></i><span class="retail-digits" id="result-cans"></span></div>
        <div class="retail-record-pepsi"><i class="retail-result-label retail-record-get" aria-label="Record get"></i><span class="retail-digits" id="record-cans"></span></div>
        <div class="retail-time-score"><i class="retail-result-label retail-clear-time" aria-label="Clear time"></i><span class="retail-digits" id="result-time"></span></div>
        <div class="retail-record-time-score"><i class="retail-result-label retail-record-time" aria-label="Record time"></i><span class="retail-digits" id="record-time"></span></div>
      </div>
      <div class="retail-awards" aria-live="polite"><i class="retail-new-record" aria-label="New record"></i><i class="retail-perfect" aria-label="Perfect"></i></div>
      <p>REFRESHMENT INTERRUPTED</p>
      <h2>GAME<br />OVER</h2>
      <div class="final-score"><span>DISTANCE</span><strong id="final-distance">0 m</strong></div>
      <button id="retry">CONTINUE</button>
    </section>

    <div class="callout" id="callout" aria-live="polite"><i></i></div>

    <nav class="mobile-controls" aria-label="Touch controls">
      <button data-control="left" aria-label="Move left">←</button>
      <button data-control="jump" aria-label="Jump">↑</button>
      <button data-control="slide" aria-label="Slide">↓</button>
      <button data-control="right" aria-label="Move right">→</button>
    </nav>

    <footer>
      <span>MODEL / TEXTURE / MOTION: ORIGINAL PLAYSTATION DISC</span>
      <span>WEBGL NATIVE BUILD</span>
    </footer>

    <audio id="music" src="assets/audio/run-theme.mp3" loop preload="auto"></audio>
    <script type="module" src="app.js"></script>
  </body>
</html>
